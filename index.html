<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rosiera flowers - باقات ورد الساتان | Taroudant</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
:root{--rose:#e11d48;--pink:#fff1f2;--beige:#fdf6f0;--dark:#2d2d2d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--beige);color:var(--dark);line-height:1.6}
.top-bar{background:var(--dark);color:#fff;text-align:center;padding:8px;font-size:14px}
.top-bar span{color:#fecdd3}
header{padding:20px;text-align:center;background:white;box-shadow:0 2px 10px rgba(0,0,0,.05);position:sticky;top:0;z-index:10}
header h1{font-family:'Cormorant Garamond',serif;font-size:32px}
.phone-badge{display:inline-block;margin-top:8px;background:var(--pink);color:var(--rose);padding:6px 14px;border-radius:20px;font-weight:700;text-decoration:none}
.hero{padding:40px 20px;text-align:center;max-width:800px;margin:auto}
.configurator{background:white;max-width:600px;margin:30px auto;padding:24px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);border:2px solid #ffe4e6}
.price-box{background:var(--dark);color:white;padding:16px;border-radius:12px;text-align:center;margin-top:16px}
.price-box .big{font-size:28px;font-weight:700;color:#fecdd3}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:1100px;margin:40px auto;padding:0 20px}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
.card img{width:100%;height:320px;object-fit:cover}
.card-body{padding:16px}
.btn{display:block;width:100%;background:var(--rose);color:white;text-align:center;padding:12px;border-radius:10px;text-decoration:none;font-weight:700;margin-top:10px;cursor:pointer}
.btn-whatsapp{background:#25D366}
.type-opt{display:flex;gap:8px;flex:1}
.type-opt button{flex:1;padding:12px;border:2px solid #eee;background:white;border-radius:10px;cursor:pointer}
.type-opt button.active{border-color:var(--rose);background:var(--pink);color:var(--rose);font-weight:700}
.row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.row label{font-weight:700;font-size:14px;flex:1 0 100%}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-family:inherit;font-size:16px}
</style>
</head>
<body>

<div class="top-bar">🚚 التوصيل متوفر في <span>تارودانت و النواحي فقط</span></div>

<header>
<h1>Boutique Fati 🌹</h1>
<p>باقات ورد الساتان التي لا تذبل أبدا</p>
<a class="phone-badge" href="https://wa.me/212673947714">📞 +212 673-947714</a>
</header>

<div class="configurator" id="config">
<h3>🧮 حاسبة الثمن - كل وردة = 10 DH</h3>
<div class="row">
<label>عدد الورود</label>
<input type="number" id="nbRoses" value="7" min="1" max="50" oninput="calc()">
</div>
<div class="row">
<label>نوع البوكيه</label>
<div class="type-opt">
<button id="btn-bouquet" class="active" onclick="setType('bouquet')">💐 بوكيه كلاسيكي</button>
<button id="btn-panier" onclick="setType('panier')">🧺 سلة ورد +15 DH</button>
</div>
</div>
<div class="row">
<div style="flex:1"><label>لون الورد</label>
<select id="couleur"><option>أحمر ❤️</option><option>أبيض 🤍</option><option>وردي 🩷</option><option>عنابي</option><option>ميكس وردي و أبيض</option></select></div>
<div style="flex:1"><label>العبارة على الشريط</label><input type="text" id="message" placeholder="مثال: لم تأت بي الصدفة..."></div>
</div>
<div class="price-box">
<div class="big" id="totalPrice">70 DH</div>
<div style="font-size:12px;opacity:.8" id="detailPrice">7 وردات × 10 = 70</div>
<a class="btn btn-whatsapp" id="waLink" href="#" target="_blank">اطلب الآن على واتساب 📲</a>
</div>
</div>

<script>
let type='bouquet';
function setType(t){type=t;document.getElementById('btn-bouquet').classList.toggle('active',t==='bouquet');document.getElementById('btn-panier').classList.toggle('active',t==='panier');calc();}
function calc(){
 const nb=parseInt(document.getElementById('nbRoses').value)||1;
 const couleur=document.getElementById('couleur').value;
 const msg=document.getElementById('message').value;
 let total=nb*10; let detail=`${nb} وردات × 10 = ${nb*10}`;
 if(type==='panier'){total+=15; detail+=` + 15 (سلة) = ${total}`;}
 document.getElementById('totalPrice').innerText=total+' DH';
 document.getElementById('detailPrice').innerText=detail;
 const typeText=type==='bouquet'?'بوكيه كلاسيكي':'سلة ورد';
 let text=`سلام بوتيك فاتي 🌹%0Aبغيت نطلب:%0A- عدد الورود: ${nb}%0A- اللون: ${couleur}%0A- النوع: ${typeText}%0A- العبارة: ${msg||'بدون'}%0A- الثمن: ${total} DH%0A- التوصيل: تارودانت`;
 document.getElementById('waLink').href=`https://wa.me/212673947714?text=${text}`;
}
calc();
</script>
</body>
</html>
